<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YugMe AI Studio</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #2563eb;
            --text: #f8fafc;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 500px;
            width: 100%;
        }
        h1 { text-align: center; color: #3b82f6; margin-bottom: 8px;}
        p.subtitle { text-align: center; color: #94a3b8; margin-top: 0; font-size: 14px; }
        
        .upload-section {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 2px dashed #475569;
            text-align: center;
            margin-bottom: 20px;
        }
        input[type="file"] { display: none; }
        .upload-btn {
            background: var(--accent);
            color: white;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            display: inline-block;
            font-weight: bold;
        }
        #preview {
            max-width: 120px;
            border-radius: 8px;
            margin-top: 10px;
            display: none;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }
        .card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 16px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: 0.2s;
            text-align: center;
        }
        .card:hover { border-color: #475569; }
        .card.selected { border-color: #3b82f6; background: #1e3a8a; }
        .card .emoji { font-size: 32px; display: block; margin-bottom: 6px; }
        .card .title { font-size: 14px; font-weight: bold; }

        .prompt-box {
            background: #020617;
            border: 1px solid #334155;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            color: #cbd5e1;
            margin-bottom: 20px;
            display: none;
            word-break: break-word;
        }

        .action-btn {
            width: 100%;
            background: #10b981;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            display: block;
            text-decoration: none;
        }
        .action-btn:disabled { background: #475569; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="container">
    <h1>YugMe AI Studio</h1>
    <p class="subtitle">Step into history with instant, recognizable face-swapping</p>

    <!-- Upload Input Box -->
    <div class="upload-section">
        <label for="selfieInput" class="upload-btn">📸 Select Your Selfie</label>
        <input type="file" id="selfieInput" accept="image/*">
        <br><img id="preview" alt="Preview">
    </div>

    <h3>Select Your Historical Setting:</h3>
    <div class="grid" id="locationGrid"></div>

    <h3>Your Face-Swap Instructions:</h3>
    <div class="prompt-box" id="promptDisplay">Select a location to reveal its AI prompt structure.</div>

    <button class="action-btn" id="genBtn" disabled>1. Copy Instructions & Open Studio</button>
</div>

<script>
    const locations = [
        { id: 1, name: "Ancient Babylon", emoji: "🦁", prompt: "High-fidelity historical portrait, executing flawless likeness retention of the source face. Subject's face is subtly textured by desert wind but strictly preserving original structural facial geometry. Draped in royal Mesopotamian deep blue wool robes with gold fringe. Background: Ishtar Gate of Babylon." },
        { id: 2, name: "Ancient Persia", emoji: "🏛️", prompt: "Cinematic ancient epic lighting, macro shot utilizing InstantID facial architecture to lock and protect the user's exact facial structure. Authentic Achaemenid Persian silk tunic with gold thread. Background: Grand stone staircases of Persepolis, Iran." },
        { id: 3, name: "Bamiyan Valley", emoji: "🛕", prompt: "Highly detailed 8k photography focusing on crisp realism, ensuring the user's face is instantly recognisable with sharp features. Wrapped in rugged silk and wool trade road shawls. Background: Bamiyan Valley, Afghanistan." },
        { id: 4, name: "Great Wall of China", emoji: "🧱", prompt: "Dramatic atmospheric mountain lighting, maintaining identical structural facial proportions of the source user. Medieval Ming Dynasty scale armour. Background: Standing atop a stone watchtower of the Great Wall of China." },
        { id: 5, name: "Old Jerusalem", emoji: "🏰", prompt: "Moody, historic oil-painting texture, securing strict facial feature mapping to retain the user's true identity. Medieval merchant in heavy linen tunics. Background: Limestone alleyways of Old City of Jerusalem, Israel." },
        { id: 6, name: "Amer Fort", emoji: "⚔️", prompt: "Vibrant, sun-drenched grand portrait, applying deep facial recognition anchoring. Heavy royal Rajasthani antique jewelry, rich brocade silk garments, and a colorful bandhani royal turban. Background: Sheesh Mahal at Amer Fort, Jaipur, Rajasthan." },
        { id: 7, name: "Victoria Terminus", emoji: "🚂", prompt: "Authentic vintage 19th-century street photography look, using advanced FaceID anchoring. Formal late-Victorian attire, lightweight linen summer suits. Background: Bustling platform of Victoria Terminus in Mumbai." },
        { id: 8, name: "Monument Valley", emoji: "🤠", prompt: "Sun-baked, high-contrast Kodachrome film look, keeping the user's face completely recognisable. Dressed in a rugged leather vest, cowboy hat. Background: Monument Valley, America." },
        { id: 9, name: "London Fog", emoji: "🕰️", prompt: "Heavy photographic silver grain, ensuring the user's eyes, jawline, and nose shape match the original photo perfectly. Sharp Victorian tailored wool overcoat. Background: Big Ben, London, UK." },
        { id: 10, name: "Nordic Snow Forest", emoji: "🌲", prompt: "Crisp, cold winter daylight macro shot, preserving the exact underlying facial structure of the user. Heavy, traditional hand-knitted Finnish wool sweater. Background: Snow-blanketed pine forest in Finland." }
    ];

    let selectedPrompt = "";
    let imageSelected = false;

    const grid = document.getElementById('locationGrid');
    const promptDisplay = document.getElementById('promptDisplay');
    const genBtn = document.getElementById('genBtn');

    locations.forEach(loc => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `<span class="emoji">${loc.emoji}</span><span class="title">${loc.name}</span>`;
        card.onclick = () => {
            document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
            card.classList.add('selected');
            selectedPrompt = loc.prompt;
            promptDisplay.innerText = loc.prompt;
            promptDisplay.style.display = 'block';
            checkReady();
        };
        grid.appendChild(card);
    });

    document.getElementById('selfieInput').addEventListener('change', function(e) {
        if (e.target.files && e.target.files[0]) {
            imageSelected = true;
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = document.getElementById('preview');
                img.src = event.target.result;
                img.style.display = 'inline-block';
                checkReady();
            }
            reader.readAsDataURL(e.target.files[0]);
        }
    });

    function checkReady() {
        if(imageSelected && selectedPrompt) {
            genBtn.disabled = false;
        }
    }

    genBtn.addEventListener('click', () => {
        // Copy the text prompt to user clipboard automatically
        navigator.clipboard.writeText(selectedPrompt).then(() => {
            alert("📋 Location settings copied to clipboard! Now dropping your photo into the Free Face Engine.");
            // Open the free engine securely in a new browser window tab
            window.open("https://huggingface.co", "_blank");
        }).catch(err => {
            // Fallback if clipboard permission is denied
            window.open("https://huggingface.co", "_blank");
        });
    });
</script>
</body>
</html>
